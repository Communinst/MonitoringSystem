---
apiVersion: v1
kind: Service
metadata:
  name: dns-monitor-svc
  namespace: kube-system 
  labels:
    app: dns-monitor
spec:
  type: ClusterIP
  selector:
    app: dns-monitor
  ports:
    - name: metrics
      port: 8080      
      targetPort: 8080 
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dns-monitor-sm
  namespace: kube-system
  labels:
    release: prom-stack 
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: dns-monitor
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s 